<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Calculator - Improvements Test</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #0A0E1A; color: #00FF41; }
        .test-result { margin: 10px 0; }
        .success { color: #00FF41; }
        .error { color: #FF4444; }
        .warning { color: #FFB86C; }
    </style>
</head>
<body>
    <h1>🧪 Retirement Calculator Improvements Test</h1>
    <div id="testResults"></div>

    <!-- Load modules -->
    <script src="./lib/constants.js"></script>
    <script src="./lib/calculations.js"></script>

    <script>
        const testResults = document.getElementById('testResults');
        
        function addResult(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            testResults.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function runTests() {
            addResult('=== Starting Improvement Tests ===', 'warning');
            
            // Check if scripts loaded
            if (typeof FinancialConstants === 'undefined') {
                addResult('✗ FinancialConstants not loaded - check constants.js path', 'error');
                return;
            }
            
            if (typeof FinancialCalculations === 'undefined') {
                addResult('✗ FinancialCalculations not loaded - check calculations.js path', 'error');
                return;
            }
            
            try {
                // Test 1: Constants loading
                addResult('✓ Test 1: Constants loaded successfully');
                addResult(`  - WITHDRAWAL_RATE: ${FinancialConstants.WITHDRAWAL_RATE}`);
                addResult(`  - MAX_SAVINGS_RATE: ${FinancialConstants.MAX_SAVINGS_RATE}`);
                addResult(`  - DEBOUNCE_DELAY_MS: ${FinancialConstants.DEBOUNCE_DELAY_MS}`);
                
                // Test 2: Basic scenario calculation
                addResult('✓ Test 2: Testing basic scenario calculation...');
                const testScenario = FinancialCalculations.calculateScenario({
                    startingAge: 25,
                    retirementAge: 45,
                    targetIncome: 120000,
                    startingBalance: 100000,
                    inflationRate: 0.03,
                    annualReturn: 0.08
                });
                
                if (testScenario.valid) {
                    addResult(`  ✓ Scenario calculated successfully`);
                    addResult(`  - Monthly contribution: $${Math.round(testScenario.monthlyContribution).toLocaleString()}`);
                    addResult(`  - Target portfolio: $${Math.round(testScenario.targetPortfolioSize).toLocaleString()}`);
                } else {
                    addResult(`  ✗ Scenario calculation failed: ${testScenario.error || 'Unknown error'}`, 'error');
                }
                
                // Test 3: Error handling
                addResult('✓ Test 3: Testing error handling...');
                const invalidScenario = FinancialCalculations.calculateScenario({
                    startingAge: 'invalid',
                    retirementAge: 45,
                    targetIncome: 120000,
                    startingBalance: 100000,
                    inflationRate: 0.03,
                    annualReturn: 0.08
                });
                
                if (!invalidScenario.valid && invalidScenario.error) {
                    addResult(`  ✓ Error handling working: ${invalidScenario.error}`);
                } else {
                    addResult(`  ✗ Error handling failed`, 'error');
                }
                
                // Test 4: Binary search improvement
                addResult('✓ Test 4: Testing binary search improvements...');
                const achievableAge = FinancialCalculations.calculateAchievableRetirementAge({
                    currentAge: 25,
                    targetIncome: 120000,
                    currentIncome: 80000,
                    savingsRate: 0.20,
                    startingBalance: 50000,
                    inflationRate: 0.03,
                    annualReturn: 0.08
                });
                
                if (achievableAge && achievableAge > 25 && achievableAge <= 100) {
                    addResult(`  ✓ Achievable retirement age: ${achievableAge}`);
                } else if (achievableAge === null) {
                    addResult(`  ✓ Correctly identified impossible scenario`, 'warning');
                } else {
                    addResult(`  ✗ Binary search returned invalid result: ${achievableAge}`, 'error');
                }
                
                // Test 5: Constants validation
                addResult('✓ Test 5: Testing constants validation...');
                const validatedAge = FinancialConstants.validateParameter(150, 'age');
                const validatedRate = FinancialConstants.validateParameter(1.5, 'savingsRate');
                
                addResult(`  - Age 150 validated to: ${validatedAge} (should be ≤ 100)`);
                addResult(`  - Savings rate 1.5 validated to: ${validatedRate} (should be ≤ 0.80)`);
                
                addResult('=== All Tests Completed ===', 'warning');
                
            } catch (error) {
                addResult(`✗ Test failed with error: ${error.message}`, 'error');
                console.error('Test error:', error);
            }
        }
        
        // Run tests when page loads
        window.addEventListener('load', function() {
            addResult('Page loaded, starting tests in 100ms...', 'warning');
            // Small delay to ensure scripts are fully loaded
            setTimeout(runTests, 100);
        });
        
        // Also add error handler for script loading
        window.addEventListener('error', function(e) {
            addResult(`Script loading error: ${e.filename} - ${e.message}`, 'error');
        });
    </script>
</body>
</html>
