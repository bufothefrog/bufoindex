<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Test - Retirement Calculator</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #FAFAF9; color: #1F2937; padding: 20px; }
        .test-result { margin: 10px 0; }
        .pass { color: #7FB069; }
        .fail { color: #dc2626; }
        .info { color: #FFB86C; }
    </style>
</head>
<body>
    <h1>BufoIndex Retirement Calculator - Integration Test</h1>
    <div id="testResults"></div>

    <!-- Load all calculator modules -->
    <script src="lib/constants.js"></script>
    <script src="lib/calculations.js"></script>
    <script src="lib/monte-carlo.js"></script>
    <script src="lib/statistical-analysis.js"></script>
    <script src="lib/financial-modeling.js"></script>
    <script src="lib/insights-engine.js"></script>
    <script src="lib/export.js"></script>
    <script src="lib/url-state.js"></script>

    <script>
        const testResults = document.getElementById('testResults');
        
        function logTest(message, status) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = `${status.toUpperCase()}: ${message}`;
            testResults.appendChild(div);
        }
        
        function logInfo(message) {
            const div = document.createElement('div');
            div.className = 'test-result info';
            div.textContent = `INFO: ${message}`;
            testResults.appendChild(div);
        }

        // Test 1: Module Loading
        logInfo('Testing module loading...');
        
        try {
            if (typeof FinancialCalculations !== 'undefined') {
                logTest('FinancialCalculations class loaded', 'pass');
            } else {
                logTest('FinancialCalculations class missing', 'fail');
            }
        } catch (e) {
            logTest(`FinancialCalculations error: ${e.message}`, 'fail');
        }

        try {
            if (typeof MonteCarloEngine !== 'undefined') {
                logTest('MonteCarloEngine class loaded', 'pass');
            } else {
                logTest('MonteCarloEngine class missing', 'fail');
            }
        } catch (e) {
            logTest(`MonteCarloEngine error: ${e.message}`, 'fail');
        }

        try {
            if (typeof StatisticalAnalysis !== 'undefined') {
                logTest('StatisticalAnalysis class loaded', 'pass');
            } else {
                logTest('StatisticalAnalysis class missing', 'fail');
            }
        } catch (e) {
            logTest(`StatisticalAnalysis error: ${e.message}`, 'fail');
        }

        try {
            if (typeof FinancialModeling !== 'undefined') {
                logTest('FinancialModeling class loaded', 'pass');
            } else {
                logTest('FinancialModeling class missing', 'fail');
            }
        } catch (e) {
            logTest(`FinancialModeling error: ${e.message}`, 'fail');
        }

        try {
            if (typeof InsightsEngine !== 'undefined') {
                logTest('InsightsEngine class loaded', 'pass');
            } else {
                logTest('InsightsEngine class missing', 'fail');
            }
        } catch (e) {
            logTest(`InsightsEngine error: ${e.message}`, 'fail');
        }


        try {
            if (typeof URLStateManager !== 'undefined') {
                logTest('URLStateManager class loaded', 'pass');
            } else {
                logTest('URLStateManager class missing', 'fail');
            }
        } catch (e) {
            logTest(`URLStateManager error: ${e.message}`, 'fail');
        }

        try {
            if (typeof ExportUtility !== 'undefined') {
                logTest('ExportUtility class loaded', 'pass');
            } else {
                logTest('ExportUtility class missing', 'fail');
            }
        } catch (e) {
            logTest(`ExportUtility error: ${e.message}`, 'fail');
        }

        // Test 2: Basic Functionality
        logInfo('Testing basic functionality...');
        
        try {
            const testParams = {
                startingAge: 25,
                retirementAge: 40,
                targetIncome: 120000,
                startingBalance: 100000,
                inflationRate: 0.03,
                annualReturn: 0.10
            };
            
            const result = FinancialCalculations.calculateScenario(testParams);
            if (result && result.valid !== false) {
                logTest('Basic scenario calculation working', 'pass');
            } else {
                logTest('Basic scenario calculation failed', 'fail');
            }
        } catch (e) {
            logTest(`Basic calculation error: ${e.message}`, 'fail');
        }

        // Test 3: Monte Carlo Integration
        logInfo('Testing Monte Carlo integration...');
        
        try {
            const scenarios = [
                { retirementAge: 40, targetIncome: 120000, startingBalance: 100000 },
                { retirementAge: 45, targetIncome: 120000, startingBalance: 100000 }
            ];
            
            const assumptions = {
                startingAge: 25,
                inflationRate: 0.03,
                accumulationReturn: 0.10,
                retirementReturn: 0.07,
                volatility: 0.15,
                monteCarloRuns: 100 // Small test run
            };
            
            const mcResults = MonteCarloEngine.runSimulations(scenarios, assumptions);
            if (mcResults && mcResults.scenarios && mcResults.scenarios.length > 0) {
                logTest('Monte Carlo simulation working', 'pass');
                logInfo(`Success rate for scenario A: ${(mcResults.scenarios[0].successRate * 100).toFixed(1)}%`);
            } else {
                logTest('Monte Carlo simulation failed', 'fail');
            }
        } catch (e) {
            logTest(`Monte Carlo error: ${e.message}`, 'fail');
        }

        // Test 4: Financial Modeling
        logInfo('Testing financial modeling...');
        
        try {
            const taxResult = FinancialModeling.calculateTaxAdjustedWithdrawal(
                100000, 'Traditional 401k/IRA', 'California', 65, 'Single'
            );
            
            if (taxResult && taxResult.netIncome) {
                logTest('Tax calculation working', 'pass');
                logInfo(`Net income from $100k withdrawal: $${taxResult.netIncome.toLocaleString()}`);
            } else {
                logTest('Tax calculation failed', 'fail');
            }
        } catch (e) {
            logTest(`Financial modeling error: ${e.message}`, 'fail');
        }

        // Test 5: URL State Management
        logInfo('Testing URL state management...');
        
        try {
            const defaultParams = URLStateManager.getDefaultParameters();
            if (defaultParams && Object.keys(defaultParams).length > 0) {
                logTest('URL state management working', 'pass');
                logInfo(`Default parameters loaded: ${Object.keys(defaultParams).length} parameters`);
            } else {
                logTest('URL state management failed', 'fail');
            }
        } catch (e) {
            logTest(`URL state error: ${e.message}`, 'fail');
        }

        logInfo('Integration test completed!');
        logInfo('Check the retirement calculator at: /tools/retirement-calculator/');
    </script>
</body>
</html>
