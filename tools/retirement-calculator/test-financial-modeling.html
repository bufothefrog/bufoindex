<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Modeling Test</title>
    <style>
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #0A0E1A;
            color: #00FF41;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            border: 1px solid #00FF41;
            padding: 15px;
            margin: 20px 0;
        }
        .test-result {
            background: #1a1a1a;
            padding: 10px;
            border-left: 3px solid #00FF41;
            margin: 10px 0;
        }
        .error {
            color: #ff4444;
            border-left-color: #ff4444;
        }
        .success {
            color: #00FF41;
        }
        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Financial Modeling Test Suite</h1>
    <div id="test-results"></div>

    <!-- Load the financial modeling modules -->
    <script src="lib/financial-modeling.js"></script>
    <script src="lib/calculations.js"></script>
    <script src="lib/url-state.js"></script>

    <script>
        class FinancialModelingTests {
            constructor() {
                this.results = [];
                this.runAllTests();
            }

            log(message, isError = false) {
                console.log(message);
                this.results.push({ message, isError });
            }

            assertEqual(actual, expected, testName) {
                if (Math.abs(actual - expected) < 0.01) {
                    this.log(`✓ ${testName}: PASSED`, false);
                } else {
                    this.log(`✗ ${testName}: FAILED - Expected ${expected}, got ${actual}`, true);
                }
            }

            runAllTests() {
                this.log("=== Starting Financial Modeling Tests ===");
                
                this.testTaxCalculations();
                this.testSocialSecurityOptimization();
                this.testHealthcareCosts();
                this.testAccountTypeOptimization();
                this.testIntegratedScenarios();
                
                this.displayResults();
            }

            testTaxCalculations() {
                this.log("\n--- Testing Tax Calculations ---");
                
                try {
                    // Test Traditional 401k withdrawal
                    const traditionalResult = FinancialModeling.calculateTaxAdjustedWithdrawal(
                        100000, // $100k withdrawal
                        'Traditional 401k/IRA',
                        'California',
                        65,
                        'Single'
                    );

                    this.log(`Traditional 401k withdrawal test:`);
                    this.log(`  Gross: $${traditionalResult.grossIncome.toLocaleString()}`);
                    this.log(`  Federal Tax: $${traditionalResult.federalTax.toLocaleString()}`);
                    this.log(`  State Tax: $${traditionalResult.stateTax.toLocaleString()}`);
                    this.log(`  Net Income: $${traditionalResult.netIncome.toLocaleString()}`);
                    this.log(`  Effective Rate: ${(traditionalResult.effectiveRate * 100).toFixed(2)}%`);

                    // Should have significant taxes on traditional withdrawal
                    if (traditionalResult.totalTax > 15000 && traditionalResult.totalTax < 30000) {
                        this.log("✓ Traditional 401k tax calculation: REASONABLE", false);
                    } else {
                        this.log(`✗ Traditional 401k tax seems off: $${traditionalResult.totalTax}`, true);
                    }

                    // Test Roth withdrawal (should be tax-free)
                    const rothResult = FinancialModeling.calculateTaxAdjustedWithdrawal(
                        100000,
                        'Roth',
                        'California',
                        65,
                        'Single'
                    );

                    this.assertEqual(rothResult.totalTax, 0, "Roth withdrawal should be tax-free");
                    this.assertEqual(rothResult.netIncome, 100000, "Roth net income should equal gross");

                    // Test Taxable account (capital gains)
                    const taxableResult = FinancialModeling.calculateTaxAdjustedWithdrawal(
                        100000,
                        'Taxable',
                        'California',
                        65,
                        'Single'
                    );

                    this.log(`Taxable account withdrawal test:`);
                    this.log(`  Total Tax: $${taxableResult.totalTax.toLocaleString()}`);
                    this.log(`  Net Income: $${taxableResult.netIncome.toLocaleString()}`);

                    // Capital gains should be taxed less than ordinary income
                    if (taxableResult.totalTax < traditionalResult.totalTax) {
                        this.log("✓ Taxable account taxed lower than Traditional: CORRECT", false);
                    } else {
                        this.log("✗ Taxable account tax rate seems high", true);
                    }

                } catch (error) {
                    this.log(`✗ Tax calculation test failed: ${error.message}`, true);
                }
            }

            testSocialSecurityOptimization() {
                this.log("\n--- Testing Social Security Optimization ---");
                
                try {
                    const ssResult = FinancialModeling.optimizeSocialSecurity(
                        30, // current age
                        65, // retirement age
                        2500, // expected monthly benefit at FRA
                        85  // life expectancy
                    );

                    this.log(`Social Security optimization test:`);
                    this.log(`  Full Retirement Age: ${ssResult.fullRetirementAge}`);
                    this.log(`  Optimal Claiming Age: ${ssResult.optimal.claimingAge}`);
                    this.log(`  Optimal Monthly Benefit: $${ssResult.optimal.monthlyBenefit.toLocaleString()}`);
                    this.log(`  Lifetime Value: $${ssResult.optimal.lifetimeValue.toLocaleString()}`);
                    this.log(`  Recommendation: ${ssResult.recommendation}`);

                    // Should find an optimal claiming age between 62 and 70
                    if (ssResult.optimal.claimingAge >= 62 && ssResult.optimal.claimingAge <= 70) {
                        this.log("✓ Optimal claiming age in valid range: PASSED", false);
                    } else {
                        this.log(`✗ Invalid optimal claiming age: ${ssResult.optimal.claimingAge}`, true);
                    }

                    // Should have scenarios for all claiming ages
                    if (ssResult.allScenarios.length === 9) { // Ages 62-70
                        this.log("✓ Generated scenarios for all claiming ages: PASSED", false);
                    } else {
                        this.log(`✗ Expected 9 scenarios, got ${ssResult.allScenarios.length}`, true);
                    }

                } catch (error) {
                    this.log(`✗ Social Security test failed: ${error.message}`, true);
                }
            }

            testHealthcareCosts() {
                this.log("\n--- Testing Healthcare Cost Projections ---");
                
                try {
                    const healthcareResult = FinancialModeling.calculateHealthcareCosts(
                        65, // starting age (Medicare eligible)
                        null, // use age-based default
                        1.5, // 1.5x multiplier for higher costs
                        0.06, // 6% healthcare inflation
                        20 // 20 years of projections
                    );

                    this.log(`Healthcare cost projection test:`);
                    this.log(`  Base Annual Cost: $${healthcareResult.baseAnnualCost.toLocaleString()}`);
                    this.log(`  Average Annual Cost: $${healthcareResult.averageAnnualCost.toLocaleString()}`);
                    this.log(`  Final Year Cost: $${healthcareResult.finalYearCost.toLocaleString()}`);
                    this.log(`  Total Lifetime Cost: $${healthcareResult.totalCumulativeCost.toLocaleString()}`);

                    // Healthcare costs should be substantial and grow over time
                    if (healthcareResult.finalYearCost > healthcareResult.baseAnnualCost) {
                        this.log("✓ Healthcare costs increase with age and inflation: PASSED", false);
                    } else {
                        this.log("✗ Healthcare costs should increase over time", true);
                    }

                    // Should have 20 years of projections
                    if (healthcareResult.projectedCosts.length === 20) {
                        this.log("✓ Generated 20 years of cost projections: PASSED", false);
                    } else {
                        this.log(`✗ Expected 20 projections, got ${healthcareResult.projectedCosts.length}`, true);
                    }

                } catch (error) {
                    this.log(`✗ Healthcare cost test failed: ${error.message}`, true);
                }
            }

            testAccountTypeOptimization() {
                this.log("\n--- Testing Account Type Optimization ---");
                
                try {
                    // High current tax rate scenario (Traditional should win)
                    const highTaxResult = FinancialModeling.determineOptimalAccountType(
                        150000, // high current income
                        0.15,   // lower retirement tax rate
                        0.32,   // high current tax rate
                        25      // 25 years to retirement
                    );

                    this.log(`High current tax rate scenario:`);
                    this.log(`  Recommended: ${highTaxResult.recommendedType}`);
                    this.log(`  Tax Savings: $${highTaxResult.taxSavings.toLocaleString()}`);
                    this.log(`  Strategy: ${highTaxResult.strategy}`);

                    // Low current tax rate scenario (Roth should win)
                    const lowTaxResult = FinancialModeling.determineOptimalAccountType(
                        50000,  // lower current income
                        0.25,   // higher retirement tax rate
                        0.12,   // low current tax rate
                        30      // 30 years to retirement
                    );

                    this.log(`Low current tax rate scenario:`);
                    this.log(`  Recommended: ${lowTaxResult.recommendedType}`);
                    this.log(`  Tax Savings: $${lowTaxResult.taxSavings.toLocaleString()}`);

                    // Should recommend Traditional for high current tax rate
                    if (highTaxResult.recommendedType === 'Traditional 401k/IRA') {
                        this.log("✓ High tax rate scenario recommends Traditional: PASSED", false);
                    } else {
                        this.log(`✗ Expected Traditional, got ${highTaxResult.recommendedType}`, true);
                    }

                } catch (error) {
                    this.log(`✗ Account type optimization test failed: ${error.message}`, true);
                }
            }

            testIntegratedScenarios() {
                this.log("\n--- Testing Integrated Scenario Analysis ---");
                
                try {
                    const scenarioConfigs = [
                        { retirementAge: 55 },
                        { retirementAge: 62 },
                        { retirementAge: 67 }
                    ];

                    const assumptions = {
                        startingAge: 30,
                        startingBalance: 100000,
                        targetIncome: 80000,
                        inflationRate: 3,
                        accumulationReturn: 8,
                        retirementReturn: 6,
                        volatility: 15,
                        monteCarloRuns: 100 // Reduced for testing
                    };

                    const taxParameters = {
                        accountType: 'Traditional 401k/IRA',
                        state: 'California',
                        filingStatus: 'Single',
                        currentAge: 30,
                        currentIncome: 80000,
                        expectedSsBenefit: 2000,
                        healthcareMultiplier: 1.2,
                        lifeExpectancy: 85,
                        currentTaxRate: 0.22,
                        retirementTaxRate: 0.15,
                        healthcareInflation: 0.05
                    };

                    const results = FinancialCalculations.calculateScenariosWithMonteCarlo(
                        scenarioConfigs,
                        assumptions,
                        taxParameters
                    );

                    this.log(`Integrated scenario analysis test:`);
                    this.log(`  Scenarios analyzed: ${results.deterministicScenarios.length}`);
                    
                    if (results.taxPlanning) {
                        this.log(`  Tax planning scenarios: ${results.taxPlanning.length}`);
                        results.taxPlanning.forEach(scenario => {
                            this.log(`    Scenario ${scenario.scenario}: $${scenario.grossWithdrawal.toLocaleString()} gross, $${scenario.netWithdrawal.toLocaleString()} net`);
                        });
                    }

                    if (results.socialSecurity) {
                        this.log(`  Social Security scenarios: ${results.socialSecurity.length}`);
                        results.socialSecurity.forEach(scenario => {
                            this.log(`    Scenario ${scenario.scenario}: Optimal claiming age ${scenario.optimalClaimingAge}, $${scenario.optimalAnnualBenefit.toLocaleString()} annual benefit`);
                        });
                    }

                    if (results.healthcareCosts) {
                        this.log(`  Healthcare cost scenarios: ${results.healthcareCosts.length}`);
                        results.healthcareCosts.forEach(scenario => {
                            this.log(`    Scenario ${scenario.scenario}: $${scenario.totalLifetimeCost.toLocaleString()} lifetime cost`);
                        });
                    }

                    // Should have enhanced results with tax planning
                    if (results.taxPlanning && results.socialSecurity && results.healthcareCosts) {
                        this.log("✓ Integrated analysis includes all financial modeling components: PASSED", false);
                    } else {
                        this.log("✗ Missing some financial modeling components", true);
                    }

                } catch (error) {
                    this.log(`✗ Integrated scenario test failed: ${error.message}`, true);
                }
            }

            displayResults() {
                const container = document.getElementById('test-results');
                const sections = {};
                let currentSection = 'General';

                this.results.forEach(result => {
                    if (result.message.startsWith('---')) {
                        currentSection = result.message.replace(/---/g, '').trim();
                        if (!sections[currentSection]) sections[currentSection] = [];
                        return;
                    }
                    if (result.message.startsWith('===')) {
                        currentSection = result.message.replace(/===/g, '').trim();
                        if (!sections[currentSection]) sections[currentSection] = [];
                        return;
                    }
                    
                    if (!sections[currentSection]) sections[currentSection] = [];
                    sections[currentSection].push(result);
                });

                Object.keys(sections).forEach(sectionName => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'test-section';
                    
                    const title = document.createElement('h2');
                    title.textContent = sectionName;
                    sectionDiv.appendChild(title);

                    sections[sectionName].forEach(result => {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = `test-result ${result.isError ? 'error' : 'success'}`;
                        resultDiv.innerHTML = `<pre>${result.message}</pre>`;
                        sectionDiv.appendChild(resultDiv);
                    });

                    container.appendChild(sectionDiv);
                });
            }
        }

        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new FinancialModelingTests();
        });
    </script>
</body>
</html>
