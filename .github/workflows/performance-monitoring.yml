name: Performance Monitoring

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC to track performance trends
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Set new performance baselines'
        type: boolean
        default: false
      report_level:
        description: 'Report detail level'
        type: choice
        options:
        - standard
        - detailed
        - full
        default: standard

jobs:
  performance-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Need full history for baseline comparison
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      run: |
        npm ci
        # Install additional performance monitoring dependencies
        npm install --no-save clinic autocannon
    
    - name: Restore performance baselines
      uses: actions/cache@v3
      with:
        path: |
          .performance-baselines.json
          .performance-history.json
        key: performance-baselines-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          performance-baselines-${{ github.ref_name }}-
          performance-baselines-main-
          performance-baselines-
    
    - name: Pre-flight health check
      run: |
        echo "🏥 Running pre-flight health checks..."
        npm run type-check || echo "⚠️ TypeScript errors detected"
        npm run lint -- --max-warnings=10 || echo "⚠️ Linting issues detected"
        
        echo "📊 System information:"
        node --version
        npm --version
        echo "CPU cores: $(nproc)"
        echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
        echo "Disk space: $(df -h . | tail -1 | awk '{print $4}')"
    
    - name: Warm up and stabilize environment
      run: |
        echo "🔥 Warming up Node.js runtime..."
        # Run lightweight warmup to stabilize V8 performance
        node -e "
          const start = Date.now();
          for(let i = 0; i < 1000000; i++) {
            Math.sqrt(Math.random() * 1000);
          }
          console.log('Warmup completed in', Date.now() - start, 'ms');
        "
    
    - name: Run performance benchmarks
      run: |
        echo "🚀 Starting performance benchmark suite..."
        
        # Set environment variables for consistent testing
        export NODE_ENV=test
        export CI=true
        export GITHUB_ACTIONS=true
        
        # Set CPU governor to performance mode for consistent results
        echo "Setting CPU scaling governor to performance..."
        echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor || true
        
        # Run the comprehensive performance monitor
        node scripts/performance-monitor.mjs \
          --ci \
          --memory \
          --report \
          ${{ github.event.inputs.baseline == 'true' && '--baseline' || '' }}
      
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        
    - name: Run regression analysis
      run: |
        echo "🔍 Running performance regression analysis..."
        node -e "
          import('./scripts/regression-detector.mjs').then(async ({ RegressionDetector }) => {
            const detector = new RegressionDetector();
            // Import current results and analyze
            const fs = require('fs').promises;
            try {
              const reportFiles = require('fs').readdirSync('.').filter(f => f.startsWith('performance-report-'));
              if (reportFiles.length > 0) {
                const latestReport = reportFiles.sort().pop();
                const report = JSON.parse(await fs.readFile(latestReport, 'utf8'));
                const analysis = await detector.analyze(report.detailed_results, {
                  version: process.env.GITHUB_SHA,
                  branch: process.env.GITHUB_REF_NAME,
                  environment: 'ci'
                });
                
                if (!analysis.passed) {
                  console.log('❌ Performance regression detected!');
                  process.exit(1);
                } else {
                  console.log('✅ No performance regressions detected');
                }
              } else {
                console.log('ℹ️ No performance report found, skipping regression analysis');
              }
            } catch (error) {
              console.error('Error in regression analysis:', error);
              process.exit(1);
            }
          });
        "
    
    - name: Generate performance dashboard data
      if: always()
      run: |
        echo "📊 Generating performance dashboard data..."
        
        # Create dashboard-friendly JSON output
        cat > performance-dashboard.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "node_version": "${{ matrix.node-version }}",
          "workflow_run": "${{ github.run_number }}",
          "actor": "${{ github.actor }}",
          "event": "${{ github.event_name }}",
          "results_file": "$(ls performance-report-*.json 2>/dev/null | tail -1 || echo 'none')",
          "alerts_file": ".performance-alerts.json"
        }
        EOF
    
    - name: Upload performance reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports-node${{ matrix.node-version }}
        path: |
          performance-report-*.json
          .performance-alerts.json
          .performance-baselines.json
          .performance-history.json
          performance-dashboard.json
        retention-days: 30
    
    - name: Cache updated performance data
      uses: actions/cache/save@v3
      if: success()
      with:
        path: |
          .performance-baselines.json
          .performance-history.json
        key: performance-baselines-${{ github.ref_name }}-${{ github.sha }}
    
    - name: Comment PR with performance results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          try {
            // Read performance alerts
            let alertsData = null;
            if (fs.existsSync('.performance-alerts.json')) {
              alertsData = JSON.parse(fs.readFileSync('.performance-alerts.json', 'utf8'));
            }
            
            // Read latest performance report
            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('performance-report-'));
            let reportData = null;
            if (reportFiles.length > 0) {
              const latestReport = reportFiles.sort().pop();
              reportData = JSON.parse(fs.readFileSync(latestReport, 'utf8'));
            }
            
            let comment = '## 📊 Performance Monitoring Results\n\n';
            comment += `**Node.js Version:** ${{ matrix.node-version }}\n`;
            comment += `**Commit:** \`${{ github.sha }}\`\n\n`;
            
            if (reportData) {
              const summary = reportData.summary;
              comment += `### Summary\n`;
              comment += `- **Tests:** ${summary.total_tests} (${summary.passed} passed, ${summary.failed} failed)\n`;
              comment += `- **Success Rate:** ${summary.success_rate}%\n`;
              comment += `- **Regressions:** ${summary.regressions}\n`;
              comment += `- **Improvements:** ${summary.improvements}\n\n`;
              
              // Add category breakdown
              comment += `### Performance by Category\n`;
              Object.entries(reportData.categories).forEach(([category, stats]) => {
                const categoryName = category.replace(/_/g, ' ').toUpperCase();
                comment += `- **${categoryName}:** ${stats.passed}/${stats.tests} passed, avg ${stats.averageDuration.toFixed(1)}ms\n`;
              });
            }
            
            if (alertsData && alertsData.regressions.length > 0) {
              comment += `\n### ⚠️ Performance Regressions\n`;
              alertsData.regressions.forEach(reg => {
                const emoji = reg.severity === 'error' ? '❌' : '⚠️';
                comment += `${emoji} **${reg.test}:** ${reg.current.toFixed(1)}ms (+${reg.regression.toFixed(1)}%)\n`;
              });
            }
            
            if (alertsData && alertsData.improvements.length > 0) {
              comment += `\n### 🚀 Performance Improvements\n`;
              alertsData.improvements.forEach(imp => {
                comment += `✅ **${imp.test}:** ${imp.current.toFixed(1)}ms (-${imp.improvement.toFixed(1)}%)\n`;
              });
            }
            
            comment += `\n---\n*Performance monitoring powered by BufoIndex Quality Gates*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not create PR comment:', error.message);
          }
    
    - name: Fail workflow on critical performance regressions
      if: always()
      run: |
        if [ -f .performance-alerts.json ]; then
          ERRORS=$(cat .performance-alerts.json | jq -r '.summary.errors // 0')
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Critical performance regressions detected ($ERRORS errors)"
            echo "Performance monitoring failed - check the alerts for details"
            exit 1
          else
            echo "✅ No critical performance regressions detected"
          fi
        else
          echo "⚠️ No performance alerts file found"
        fi

  performance-trend-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.report_level == 'full'
    needs: performance-monitoring
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Download performance reports
      uses: actions/download-artifact@v4
      with:
        name: performance-reports-node20
    
    - name: Generate trend analysis
      run: |
        echo "📈 Generating performance trend analysis..."
        
        # Create trend analysis script
        node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('.performance-history.json', 'utf8') || '[]');
          
          console.log('Performance Trend Analysis');
          console.log('==========================');
          console.log('Total historical runs:', data.length);
          
          if (data.length >= 5) {
            // Analyze trends for key metrics
            const recentRuns = data.slice(-10);
            console.log('Recent runs analyzed:', recentRuns.length);
            
            // Calculate average performance trends
            const categories = ['basic_calculations', 'complex_tax', 'monte_carlo'];
            categories.forEach(category => {
              console.log(\`\n\${category.replace('_', ' ').toUpperCase()} TRENDS:\`);
              // Trend analysis would go here
              console.log('  Trend analysis implementation needed');
            });
          } else {
            console.log('Insufficient historical data for trend analysis');
          }
        "
    
    - name: Upload trend analysis
      uses: actions/upload-artifact@v4
      with:
        name: performance-trend-analysis
        path: performance-trend-*.json
        retention-days: 90