{{ define "main" }}
<article class="max-w-6xl mx-auto px-4 py-8">
  <!-- Page Header -->
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-text-primary mb-2">{{ .Title }}</h1>
    <p class="text-text-secondary text-lg leading-relaxed">{{ .Description }}</p>
  </header>

  <!-- Introduction Content -->
  <div class="prose prose-lg max-w-none mb-8 font-serif text-text-primary">
    {{ .Content }}
  </div>

  <!-- Calculator Interface -->
  <div class="bg-terminal-black rounded-lg border border-gray-700 overflow-hidden">
    <!-- Calculator Header -->
    <div class="bg-gray-800 px-6 py-4 border-b border-gray-700">
      <div class="flex items-center">
        <span class="text-terminal-green font-mono text-sm mr-3">[CALC]</span>
        <span class="text-text-light font-mono text-lg">Rent vs Buy Analysis</span>
        <div class="ml-auto flex space-x-2">
          <button id="shareBtn" class="text-sage hover:text-sage-light font-mono text-sm px-3 py-1 border border-sage rounded transition-colors">
            SHARE
          </button>
          <button id="resetBtn" class="text-accent hover:text-white font-mono text-sm px-3 py-1 border border-accent rounded transition-colors">
            RESET
          </button>
        </div>
      </div>
    </div>

    <!-- Calculator Body -->
    <div class="p-6 space-y-8">
      <!-- Loading/Error States -->
      <div id="loading" class="text-center py-8 hidden">
        <div class="text-terminal-green font-mono">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-terminal-green"></div>
          <div class="mt-2">Calculating...</div>
        </div>
      </div>
      
      <div id="error" class="bg-red-900 border border-red-700 text-red-100 px-4 py-3 rounded font-mono text-sm hidden"></div>
      <div id="message" class="bg-green-900 border border-green-700 text-green-100 px-4 py-3 rounded font-mono text-sm hidden"></div>

      <!-- Input Section -->
      <section class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-4">
          <h3 class="text-terminal-green font-mono text-sm mb-4">[PROPERTY]</h3>
          <div class="space-y-3">
            <div>
              <label for="homePrice" class="block text-text-light font-mono text-xs mb-1">Home Price ($)</label>
              <input type="number" id="homePrice" class="w-full bg-terminal-black border border-gray-600 text-text-light font-mono px-3 py-2 rounded focus:border-sage focus:outline-none" value="600000" min="50000" max="10000000" step="1000">
            </div>
            <div>
              <label for="monthlyRent" class="block text-text-light font-mono text-xs mb-1">Monthly Rent ($)</label>
              <input type="number" id="monthlyRent" class="w-full bg-terminal-black border border-gray-600 text-text-light font-mono px-3 py-2 rounded focus:border-sage focus:outline-none" value="2500" min="500" max="50000" step="50">
            </div>
            <div>
              <label for="state" class="block text-text-light font-mono text-xs mb-1">State</label>
              <select id="state" class="w-full bg-terminal-black border border-gray-600 text-text-light font-mono px-3 py-2 rounded focus:border-sage focus:outline-none">
                <option value="CA">California</option>
                <option value="TX">Texas</option>
                <option value="FL">Florida</option>
                <option value="NY">New York</option>
                <option value="IL">Illinois</option>
                <option value="WA">Washington</option>
                <option value="NJ">New Jersey</option>
                <option value="CT">Connecticut</option>
                <option value="MA">Massachusetts</option>
                <option value="NH">New Hampshire</option>
                <!-- Add all other states as needed -->
              </select>
            </div>
          </div>
        </div>

        <div class="bg-gray-900 rounded-lg border border-gray-700 p-4">
          <h3 class="text-terminal-green font-mono text-sm mb-4">[FINANCING]</h3>
          <div class="space-y-3">
            <div>
              <label for="downPaymentPercent" class="block text-text-light font-mono text-xs mb-1">Down Payment <span id="downPaymentPercentDisplay" class="text-accent">20%</span></label>
              <input type="range" id="downPaymentPercent" class="w-full" min="3" max="50" value="20" step="1">
              <div class="text-terminal-green font-mono text-xs mt-1" id="downPaymentAmountDisplay">$120,000</div>
            </div>
            <div>
              <label for="mortgageRate" class="block text-text-light font-mono text-xs mb-1">Mortgage Rate <span id="mortgageRateDisplay" class="text-accent">6.5%</span></label>
              <input type="range" id="mortgageRate" class="w-full" min="1" max="15" value="6.5" step="0.1">
            </div>
            <div>
              <label for="mortgageTerm" class="block text-text-light font-mono text-xs mb-1">Term (years)</label>
              <select id="mortgageTerm" class="w-full bg-terminal-black border border-gray-600 text-text-light font-mono px-3 py-2 rounded focus:border-sage focus:outline-none">
                <option value="15">15 years</option>
                <option value="20">20 years</option>
                <option value="25">25 years</option>
                <option value="30" selected>30 years</option>
              </select>
            </div>
            <div>
              <label for="hoaFee" class="block text-text-light font-mono text-xs mb-1">HOA Fee ($/month)</label>
              <input type="number" id="hoaFee" class="w-full bg-terminal-black border border-gray-600 text-text-light font-mono px-3 py-2 rounded focus:border-sage focus:outline-none" value="0" min="0" max="2000" step="25">
            </div>
          </div>
        </div>

        <div class="bg-gray-900 rounded-lg border border-gray-700 p-4">
          <h3 class="text-terminal-green font-mono text-sm mb-4">[ASSUMPTIONS]</h3>
          <div class="space-y-3">
            <div>
              <label for="homeAppreciationRate" class="block text-text-light font-mono text-xs mb-1">Home Appreciation <span id="homeAppreciationRateDisplay" class="text-accent">3%</span></label>
              <input type="range" id="homeAppreciationRate" class="w-full" min="-2" max="8" value="3" step="0.1">
            </div>
            <div>
              <label for="investmentReturn" class="block text-text-light font-mono text-xs mb-1">Investment Return <span id="investmentReturnDisplay" class="text-accent">7%</span></label>
              <input type="range" id="investmentReturn" class="w-full" min="1" max="12" value="7" step="0.1">
            </div>
            <div>
              <label for="rentGrowthRate" class="block text-text-light font-mono text-xs mb-1">Rent Growth <span id="rentGrowthRateDisplay" class="text-accent">3%</span></label>
              <input type="range" id="rentGrowthRate" class="w-full" min="0" max="8" value="3" step="0.1">
            </div>
            <div>
              <label for="marginalTaxRate" class="block text-text-light font-mono text-xs mb-1">Tax Rate <span id="marginalTaxRateDisplay" class="text-accent">24%</span></label>
              <input type="range" id="marginalTaxRate" class="w-full" min="10" max="45" value="24" step="1">
            </div>
            <div>
              <label for="timeHorizon" class="block text-text-light font-mono text-xs mb-1">Time Horizon (years)</label>
              <input type="range" id="timeHorizon" class="w-full" min="5" max="30" value="30" step="1">
              <div class="text-terminal-green font-mono text-xs mt-1" id="timeHorizonDisplay">30 years</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Results Summary -->
      <section class="bg-gray-900 rounded-lg border border-gray-700 p-6">
        <h3 class="text-terminal-green font-mono text-sm mb-4">[RESULTS] Summary</h3>
        
        <!-- Monthly Comparison -->
        <div class="bg-terminal-black rounded border border-gray-600 p-4 mb-4">
          <h4 class="text-accent font-mono text-xs mb-2">MONTHLY COSTS</h4>
          <div id="monthlyComparison">
            <!-- Populated by JavaScript -->
          </div>
        </div>

        <!-- Key Metrics -->
        <div class="grid md:grid-cols-4 gap-4">
          <div class="bg-terminal-black rounded border border-gray-600 p-3">
            <div class="text-accent font-mono text-xs">RECOMMENDATION</div>
            <div id="recommendation" class="mt-1">
              <!-- Populated by JavaScript -->
            </div>
          </div>
          <div class="bg-terminal-black rounded border border-gray-600 p-3">
            <div class="text-accent font-mono text-xs">BREAKEVEN</div>
            <div id="breakeven" class="text-text-light font-mono mt-1">
              <!-- Populated by JavaScript -->
            </div>
          </div>
          <div class="bg-terminal-black rounded border border-gray-600 p-3">
            <div class="text-accent font-mono text-xs">BUY NET WORTH</div>
            <div id="buyingNetWorth" class="text-text-light font-mono mt-1">
              <!-- Populated by JavaScript -->
            </div>
          </div>
          <div class="bg-terminal-black rounded border border-gray-600 p-3">
            <div class="text-accent font-mono text-xs">RENT NET WORTH</div>
            <div id="rentingNetWorth" class="text-text-light font-mono mt-1">
              <!-- Populated by JavaScript -->
            </div>
          </div>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-700">
          <div class="text-accent font-mono text-xs">FINAL DIFFERENCE</div>
          <div id="finalDifference" class="text-lg font-mono mt-1">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </section>

      <!-- Chart Visualization -->
      <section id="chart">
        <!-- Populated by JavaScript -->
      </section>

      <!-- Detailed Results Table -->
      <section id="detailedResults">
        <!-- Populated by JavaScript -->
      </section>

      <!-- Export Actions -->
      <section class="flex justify-center space-x-4">
        <button id="exportCsvBtn" class="bg-sage text-black font-mono px-6 py-3 rounded hover:bg-sage-dark transition-colors">
          EXPORT CSV
        </button>
        <button id="exportJsonBtn" class="bg-accent text-black font-mono px-6 py-3 rounded hover:bg-orange-400 transition-colors">
          EXPORT JSON
        </button>
      </section>
    </div>
  </div>

  <!-- Year Detail Modal -->
  <div id="yearDetailModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 modal" style="display: none;">
    <div id="yearDetailContent" class="max-h-screen overflow-y-auto">
      <!-- Populated by JavaScript -->
    </div>
  </div>
</article>

<!-- Load required JavaScript files -->
<script src="/js/utils/calculations.js"></script>
<script src="/js/utils/url-state.js"></script>
<script src="/js/utils/export.js"></script>
<script src="/js/rent-vs-buy-calculator.js"></script>

<style>
/* Custom slider styling to match terminal aesthetic */
input[type="range"] {
  -webkit-appearance: none;
  background: #0A0E1A;
  border: 1px solid #4A5568;
  border-radius: 4px;
  height: 8px;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  background: #7FB069;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  background: #7FB069;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

input[type="range"]:focus {
  border-color: #7FB069;
  outline: none;
}

/* Modal styling */
.modal {
  z-index: 1000;
}
</style>
{{ end }}
