{{/* Terminal-style calculation display */}}
{{ $title := .Get "title" | default "Calculation" }}

<div class="calculation-block my-6 bg-gray-900 rounded-lg border border-gray-700">
  <div class="bg-gray-800 px-4 py-2 border-b border-gray-700 flex items-center">
    <span class="text-yellow-400 font-mono text-sm mr-2">
      [CALC]
    </span>
    <span class="text-white font-mono text-sm">{{ $title }}</span>
  </div>
  <div class="p-4 font-mono text-sm">
    <div class="text-gray-300 space-y-1 whitespace-pre-wrap">{{ .Inner | safeHTML }}</div>
  </div>
</div>
