{{/* Terminal-style formula display */}}
{{ $title := .Get "title" | default "Formula" }}

<div class="formula-block my-6 bg-gray-900 rounded-lg border border-gray-700">
  <div class="bg-gray-800 px-4 py-2 border-b border-gray-700">
    <span class="text-green-400 font-mono text-sm">
      [FORMULA] {{ $title }}
    </span>
  </div>
  <div class="p-4 font-mono text-center">
    <div class="text-green-300 text-lg">
      {{ .Inner | safeHTML }}
    </div>
  </div>
</div>
