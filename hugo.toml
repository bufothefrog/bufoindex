baseURL = 'https://bufothefrog.github.io/bufoindex/'
languageCode = 'en-us'
title = 'BUFOINDEX'
theme = 'bufoindex'

[params]
  description = "Personal finance education platform bridging basic advice and sophisticated wealth strategies"
  author = "Bufo"
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true
    codeFences = true

[menu]
  [[menu.main]]
    name = "Articles"
    url = "/articles/"
    weight = 10
  [[menu.main]]
    name = "Tools"
    url = "/tools/"
    weight = 20

[build]
  writeStats = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false