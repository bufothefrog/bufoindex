baseURL = 'https://bufothefrog.github.io/bufoindex/'
languageCode = 'en-us'
title = 'BufoIndex'
theme = 'bufoindex'

# Site Parameters
[params]
  description = 'Personal finance education platform bridging basic advice and sophisticated strategies'
  author = 'BufoIndex'
  sage = '#7FB069'
  terminalBlack = '#0A0E1A'
  terminalGreen = '#00FF41'
  accent = '#FFB86C'
  background = '#FAFAF9'
  text = '#1A202C'

# Syntax Highlighting
[markup]
  [markup.highlight]
    style = 'github'
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Main Menu
[[menu.main]]
  name = 'Articles'
  url = '/articles/'
  weight = 10

[[menu.main]]
  name = 'Tools'
  url = '/tools/'
  weight = 20

[[menu.main]]
  name = 'About'
  url = '/about/'
  weight = 30
